    async function loadSettingsFromFirebase() {
        try {
            const settingsDoc = await db.collection('settings').doc('payment').get();
            if (settingsDoc.exists) {
                const data = settingsDoc.data();
                if (data.bkashNumber) {
                    bkashNumber = data.bkashNumber;
                    localStorage.setItem('bkashNumber', data.bkashNumber);
                }
                if (data.nagadNumber) {
                    nagadNumber = data.nagadNumber;
                    localStorage.setItem('nagadNumber', data.nagadNumber);
                }
            }
        } catch (error) {
            console.error('সেটিংস লোড ত্রুটি:', error);
        }
    }

    // ---------- সেটিংস সেভ ফায়ারবেসে ----------
    async function saveSettingsToFirebase() {
        try {
            await db.collection('settings').doc('payment').set({
                bkashNumber: bkashNumber,
                nagadNumber: nagadNumber,
                updatedAt: new Date()
            });
            return true;
        } catch (error) {
            console.error('সেটিংস সেভ ত্রুটি:', error);
            return false;
        }
    }

    window.placeOrder = async function(serviceId, serviceName, price) {
        if (!currentUser) {
            alert('লগইন প্রয়োজন');
            return;
        }
        
        if (userBalance < price) {
            alert('পর্যাপ্ত ব্যালেন্স নেই। অ্যাড মানি করুন');
            return;
        }
        
        try {
            const newBalance = userBalance - price;
            await db.collection('users').doc(currentUser.uid).update({
                balance: newBalance
            });
            
            const orderData = {
                userId: currentUser.uid,
                userPhone: currentUser.email.split('@')[0],
                serviceId: serviceId,
                serviceName: serviceName,
                price: price,
                status: 'pending',
                timestamp: new Date(),
                details: {}
            };
            
            // ডিটেইলস সংগ্রহ
            if (serviceId == 1 || serviceId == 2 || serviceId == 7) {
                orderData.details = {
                    nidNumber: document.getElementById('nidNumber')?.value || '',
                    dob: document.getElementById('dob')?.value || ''
                };
            }
            else if (serviceId == 3) {
                orderData.details = {
                    district: document.getElementById('district')?.value || '',
                    name: document.getElementById('name')?.value || '',
                    fatherName: document.getElementById('fatherName')?.value || '',
                    motherName: document.getElementById('motherName')?.value || '',
                    dob: document.getElementById('dob')?.value || ''
                };
            }
            else if (serviceId == 9) {
                orderData.details = {
                    phone: document.getElementById('phone')?.value || ''
                };
            }
            else if (serviceId == 10) {
                orderData.details = {
                    applicantName: document.getElementById('applicantName')?.value || '',
                    birthRegNumber: document.getElementById('birthRegNumber')?.value || '',
                    dob: document.getElementById('dob')?.value || ''
                };
            }
            else if (serviceId == 11) {
                orderData.details = {
                    name: document.getElementById('name')?.value || '',
                    nidNumber: document.getElementById('nidNumber')?.value || '',
                    dob: document.getElementById('dob')?.value || ''
                };
            }
            else if (serviceId >= 12 && serviceId <= 15) {
                orderData.details = {
                    phoneNumber: document.getElementById('phoneNumber')?.value || '',
                    nidNumber: document.getElementById('nidNumber')?.value || '',
                    dob: document.getElementById('dob')?.value || ''
                };
            }
            else if (serviceId == 16) {
                orderData.details = {
                    imeiNumber: document.getElementById('imeiNumber')?.value || ''
                };
            }
            else if (serviceId == 17) {
                orderData.details = {
                    phoneNumber: document.getElementById('phoneNumber')?.value || ''
                };
            }
            
            await db.collection('orders').add(orderData);
            
            userBalance = newBalance;
            alert('✅ অর্ডার সফল হয়েছে!');
            
            renderHomePage();
            
        } catch (error) {
            console.error('অর্ডার ত্রুটি:', error);
            alert('অর্ডার ব্যর্থ হয়েছে। আবার চেষ্টা করুন।');
        }
    };

    // ---------- অর্ডার লোড ----------
    async function loadOrders() {
        if (!currentUser) return;
        
        try {
            const snapshot = await db.collection('orders')
                .where('userId', '==', currentUser.uid)
                .orderBy('timestamp', 'desc')
                .limit(10)
                .get();
            
            let html = '';
            if (snapshot.empty) {
                html = `
                    <div class="bg-white rounded-xl p-8 text-center shadow-sm">
                        <i class="fas fa-shopping-bag text-gray-300 text-5xl mb-3"></i>
                        <p class="text-gray-500">কোন অর্ডার নেই</p>
                    </div>
                `;
            } else {
                snapshot.forEach(doc => {
                    const order = doc.data();
                    const date = order.timestamp?.toDate().toLocaleDateString('bn-BD', {
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric',
                        hour: '2-digit', 
                        minute: '2-digit'
                    });
                    
                    const statusClass = order.status === 'pending' ? 'status-pending' : 'status-completed';
                    const statusText = order.status === 'pending' ? '⏳ পেন্ডিং' : '✅ সম্পন্ন';
                    
                    html += `
                        <div class="order-item">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-gray-800">${order.serviceName}</span>
                                <span class="text-[#3498db] font-bold text-lg">৳${order.price}</span>
                            </div>
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-gray-500">${date || ''}</span>
                                <span class="${statusClass} px-3 py-1 rounded-full text-xs font-medium">
                                    ${statusText}
                                </span>
                            </div>
                        </div>
                    `;
                });
            }
            
            const ordersList = document.getElementById('ordersList');
            if (ordersList) ordersList.innerHTML = html;
            
            const orderCount = document.getElementById('orderCount');
            if (orderCount) orderCount.textContent = snapshot.size;
            
        } catch (error) {
            console.error('অর্ডার লোড ত্রুটি:', error);
        }
    }

    window.handleLogin = async function() {
        const phone = document.getElementById('login-phone')?.value;
        const password = document.getElementById('login-password')?.value;
        
        if (!phone || !password) {
            alert('ফোন ও পাসওয়ার্ড দিন');
            return;
        }
        
        const email = phone.trim() + '@almar-seba.com';
        
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (error) {
            alert('লগইন ব্যর্থ: ' + error.message);
        }
    };

    // ---------- রেজিস্টার ----------
    window.handleRegister = async function() {
        const phone = document.getElementById('reg-phone')?.value;
        const password = document.getElementById('reg-password')?.value;
        const confirmPass = document.getElementById('reg-confirm-password')?.value;
        
        if (!phone || !password || !confirmPass) {
            alert('সব তথ্য দিন');
            return;
        }
        
        if (password !== confirmPass) {
            alert('পাসওয়ার্ড মিলছে না');
            return;
        }
        
        const email = phone.trim() + '@almar-seba.com';
        
        try {
            const result = await auth.createUserWithEmailAndPassword(email, password);
            
            await db.collection('users').doc(result.user.uid).set({
                phone: phone,
                email: email,
                balance: 0,
                createdAt: new Date()
            });
            
            alert('রেজিস্ট্রেশন সফল! এখন লগইন করুন');
            await auth.signOut();
            renderLoginPage();

                                        </button>
                                        <button onclick="rejectRequest('${doc.id}')" 
                                            class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">
                                            <i class="fas fa-times mr-1"></i>রিজেক্ট
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = '<p class="text-red-500 text-center py-8">রিকোয়েস্ট লোড করতে ব্যর্থ। ইন্ডেক্স তৈরি করুন।</p>';
            }
        }
        
        else if (tab === 'services') {
            let html = `
                <h3 class="font-bold mb-3 text-lg flex items-center">
                    <i class="fas fa-cog text-[#3498db] mr-2"></i>
                    সার্ভিস প্রাইস ম্যানেজ (মোট ${services.length} টি)
                </h3>
                <div class="space-y-3 max-h-96 overflow-y-auto">
            `;
            
            services.sort((a, b) => a.id - b.id).forEach(service => {
                html += `
                    <div class="flex items-center gap-2 bg-gray-50 p-3 rounded">
                        <div class="w-10 h-10 bg-[#3498db] bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i class="fas ${service.icon} text-[#3498db]"></i>
                        </div>
                        <span class="flex-1 font-medium text-sm">${service.name}</span>
                        <input type="number" id="price${service.id}" value="${service.price}" class="w-20 border p-2 rounded text-center">
                        <button onclick="updateServicePrice(${service.id})" class="bg-gradient-to-r from-[#3498db] to-[#2980b9] text-white px-4 py-2 rounded text-sm whitespace-nowrap">
                            আপডেট
                        </button>
                    </div>
                `;
            });
            
            html += '</div>';
            content.innerHTML = html;
        }
        
        else if (tab === 'orders') {
            try {
                const snapshot = await db.collection('orders')
                    .orderBy('timestamp', 'desc')
                    .limit(20)
                    .get();
                    
                let html = `
                    <h3 class="font-bold mb-3 text-lg flex items-center">
                        <i class="fas fa-shopping-bag text-[#3498db] mr-2"></i>
                        সর্বশেষ অর্ডার সমূহ (${snapshot.size} টি)
                    </h3>
                `;
                
                if (snapshot.empty) {
                    html += '<p class="text-gray-500 text-center py-4">কোন অর্ডার নেই</p>';
                } else {
                    html += '<div class="space-y-2 max-h-96 overflow-y-auto">';
                    snapshot.forEach(doc => {
                        const order = doc.data();
                        const date = order.timestamp ? new Date(order.timestamp.toDate()).toLocaleString('bn-BD') : 'তারিখ নেই';
                        const statusClass = order.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700';
                        html += `
                            <div class="border p-3 rounded bg-white hover:shadow transition-shadow">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="font-medium">📱 ${order.userPhone}</p>
                                        <p class="font-semibold text-sm">${order.serviceName}</p>
                                        <p class="text-[#3498db] font-bold">৳${order.price}</p>
                                        <p class="text-xs text-gray-500">${date}</p>
                                    </div>
                                    <span class="px-2 py-1 ${statusClass} rounded text-xs">${order.status}</span>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = '<p class="text-red-500 text-center py-8">অর্ডার লোড করতে ব্যর্থ</p>';
            }
        }
        
        else if (tab === 'addService') {
            content.innerHTML = `
                <h3 class="font-bold mb-4 text-lg flex items-center">
                    <i class="fas fa-plus-circle text-green-500 mr-2"></i>
                    নতুন সার্ভিস যোগ করুন
                </h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">সার্ভিসের নাম</label>
                        <input type="text" id="newServiceName" placeholder="যেমন: বায়োমেট্রিক রবি" 
                            class="w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-green-500">
                    </div>
                    
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">আইকন (Font Awesome)</label>
                        <input type="text" id="newServiceIcon" placeholder="যেমন: fa-sim-card" 
                            class="w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-green-500">
                        <p class="text-xs text-gray-500 mt-1">Font Awesome আইকন ক্লাস (fa-solid ছাড়া)</p>
                    </div>
                    
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">মূল্য (টাকা)</label>
                        <input type="number" id="newServicePrice" placeholder="যেমন: 200" 
                            class="w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-green-500">
                    </div>
                    
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">বিবরণ</label>
                        <textarea id="newServiceDescription" rows="3" placeholder="সার্ভিস সম্পর্কে সংক্ষিপ্ত বিবরণ" 
                            class="w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-green-500"></textarea>
                    </div>
                    
                    <button onclick="addNewService()" 
                        class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all">
                        <i class="fas fa-save mr-2"></i>
                        সার্ভিস সংরক্ষণ করুন
                    </button>
                </div>
            `;
        }
    };

    // ---------- নতুন সার্ভিস এড করার ফাংশন ----------
    window.addNewService = async function() {
        const name = document.getElementById('newServiceName')?.value;
        const icon = document.getElementById('newServiceIcon')?.value;
        const price = document.getElementById('newServicePrice')?.value;
        const description = document.getElementById('newServiceDescription')?.value;
        
        if (!name || !icon || !price) {
            alert('সব তথ্য দিন');
            return;
        }
        
        // সর্বোচ্চ আইডি বের করা
        const maxId = services.length > 0 ? Math.max(...services.map(s => s.id)) : 0;
        const newId = maxId + 1;
        
        try {
            await db.collection('services').doc(newId.toString()).set({
                id: newId,
                name: name,
                icon: icon,
                price: parseInt(price),
                description: description || ''
            });
            
            alert('✅ নতুন সার্ভিস যোগ করা হয়েছে!');
            
            // সার্ভিস রিলোড
            await loadServicesFromFirebase();
            showAdminTab('services');
            
        } catch (error) {
            console.error('সার্ভিস যোগ ত্রুটি:', error);
            alert('সার্ভিস যোগ করতে ব্যর্থ হয়েছে');
        }
    };

    // ---------- এডমিন ফাংশন ----------
    window.approveRequest = async function(requestId, amount, userId) {
        try {
            await db.collection('moneyRequests').doc(requestId).update({ status: 'approved' });
            
            const userRef = db.collection('users').doc(userId);
            const userDoc = await userRef.get();
            const currentBalance = userDoc.data().balance || 0;
            await userRef.update({ balance: currentBalance + amount });
            
            alert('✅ অ্যাপ্রুভ করা হয়েছে');
            showAdminTab('requests');
        } catch (error) {
            alert('অ্যাপ্রুভ করতে ব্যর্থ');
        }
    };

    window.rejectRequest = async function(requestId) {
        try {
            await db.collection('moneyRequests').doc(requestId).update({ status: 'rejected' });
            alert('❌ রিজেক্ট করা হয়েছে');
            showAdminTab('requests');
        } catch (error) {
            alert('রিজেক্ট করতে ব্যর্থ');
        }
    };

    window.updateServicePrice = async function(serviceId) {
        const price = document.getElementById(`price${serviceId}`)?.value;
        if (!price) return;
        
        const service = services.find(s => s.id == serviceId);
        if (!service) return;
        
        try {
            await db.collection('services').doc(serviceId.toString()).update({
                price: parseInt(price)
            });
            
            service.price = parseInt(price);
            alert(`✅ ${service.name} এর মূল্য ${price} টাকা সেট করা হয়েছে`);
        } catch (error) {
            alert('আপডেট করতে ব্যর্থ');
        }
    };

    window.addBalance = async function(userId, phone) {
        const amount = prompt(`${phone} এর জন্য কত টাকা রিচার্জ করবেন?`, "100");
        if (!amount) return;
        
        try {
            const userRef = db.collection('users').doc(userId);
            const userDoc = await userRef.get();
            const currentBalance = userDoc.data().balance || 0;
            await userRef.update({ balance: currentBalance + parseInt(amount) });
            
            alert(`✅ ${phone} এর ব্যালেন্সে ${amount} টাকা যোগ করা হয়েছে`);
            showAdminTab('users');
        } catch (error) {
            alert('রিচার্জ করতে ব্যর্থ');
        }
    };

    // ---------- এডমানি নাম্বার আপডেট ----------
    window.updateBkashNumber = async function() {
        const newNumber = document.getElementById('bkashNumberInput')?.value;
        if (newNumber && newNumber.length >= 11) {
            bkashNumber = newNumber;
            localStorage.setItem('bkashNumber', newNumber);
            
            const success = await saveSettingsToFirebase();
            if (success) {
                alert('✅ বিকাশ নাম্বার আপডেট করা হয়েছে');
            } else {
                alert('⚠️ নাম্বার আপডেট হয়েছে কিন্তু Firebase-এ সেভ হয়নি');
            }
        } else {
            alert('❌ সঠিক নাম্বার দিন (১১ ডিজিট)');
        }
    };

    window.updateNagadNumber = async function() {
        const newNumber = document.getElementById('nagadNumberInput')?.value;
        if (newNumber && newNumber.length >= 11) {
            nagadNumber = newNumber;
            localStorage.setItem('nagadNumber', newNumber);
            
            const success = await saveSettingsToFirebase();
            if (success) {
                alert('✅ নগদ নাম্বার আপডেট করা হয়েছে');
            } else {
                alert('⚠️ নাম্বার আপডেট হয়েছে কিন্তু Firebase-এ সেভ হয়নি');
            }
        } else {
            alert('❌ সঠিক নাম্বার দিন (১১ ডিজিট)');
        }
    };

    // ---------- অথ স্টেট চেক ----------
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            const phone = user.email.split('@')[0];
            
            await loadServicesFromFirebase();
            await loadSettingsFromFirebase();
            await loadUserBalance();
            
            if (phone === '01828407381') {
                renderAdminPanel();
            } else {
                renderHomePage();
            }
        } else {
            renderLoginPage();
        }
    });
</script>
</body>
</html>
